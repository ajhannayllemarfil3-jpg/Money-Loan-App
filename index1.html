<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Loan App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#050509; --card:#0b0b14; --line:#23223a;
    --purple:#8b5cf6; --purple2:#7c3aed;
    --violet-deep:#4c2fc4; --blue-deep:#2a3ee0;
    --success:#22c55e; --muted:#9a97b3;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Helvetica Neue',Arial,sans-serif;}
  body{
    background:#000; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .phone-shell{
    width:380px; height:800px;
    background:var(--card); border:1.5px solid var(--line); border-radius:36px;
    padding:16px; box-shadow:0 30px 80px -30px rgba(139,92,246,.25);
    display:flex; flex-direction:column;
  }
  .topbar{
    display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    letter-spacing:1px; color:#fff; padding:4px 4px 12px; position:relative;
  }
  .topbar .back{
    cursor:pointer; font-size:18px; color:var(--muted); width:24px;
  }
  .topbar .logo{
    width:18px; height:18px; border-radius:5px; background:var(--purple);
    display:flex; align-items:center; justify-content:center; font-size:11px;
  }
  .screen{
    flex:1; border-radius:22px; overflow-y:auto; position:relative;
    background:linear-gradient(160deg, var(--violet-deep), var(--blue-deep));
    padding:22px 18px; color:#fff; display:flex; flex-direction:column;
  }
  .screen.light{ background:var(--card); border:1px solid var(--line); }
  .screen.plain{ background:#fff; color:#222; }
  .screen::-webkit-scrollbar{width:0;}

  h1.title{ font-size:22px; font-weight:800; margin-bottom:6px; line-height:1.2;}
  p.sub{ font-size:13px; color:rgba(255,255,255,.7); margin-bottom:18px; }
  .screen.light p.sub, .screen.light label{ color:var(--muted); }

  label{ font-size:12px; color:rgba(255,255,255,.7); display:block; margin-bottom:6px; margin-top:14px; }
  input{
    width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    border-radius:10px; padding:12px 14px; color:#fff; font-size:14px; outline:none;
  }
  .screen.light input{ background:#151522; border-color:var(--line); color:#fff; }
  input::placeholder{ color:rgba(255,255,255,.4); }
  input:focus{ border-color:var(--purple); }

  .btn{
    background:linear-gradient(90deg,#7c5cfc,#6c4ff6); border:none; border-radius:12px;
    padding:15px; text-align:center; font-weight:800; font-size:14px; letter-spacing:.3px;
    color:#fff; cursor:pointer; margin-top:20px; transition:.15s;
  }
  .btn:hover{ filter:brightness(1.1); }
  .btn:active{ transform:scale(.98); }
  .btn.outline{ background:transparent; border:1.5px solid rgba(255,255,255,.5); }
  .btn.white{ background:#fff; color:#4c2fc4; }
  .btn.ghost{ background:transparent; color:var(--purple); box-shadow:none; margin-top:8px; padding:8px;}

  .link{ text-align:center; font-size:12.5px; color:rgba(255,255,255,.65); margin-top:14px; }
  .link b{ color:#fff; cursor:pointer; }

  .otp-row{ display:flex; gap:8px; margin:14px 0 6px; }
  .otp-row input{ text-align:center; padding:14px 0; font-size:18px; }
  .timer{ font-size:12px; color:rgba(255,255,255,.55); margin-bottom:4px; }
  .hint{ font-size:11px; color:rgba(255,255,255,.4); margin-top:2px; }

  .stat-card{
    background:#141420; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px;
  }
  .stat-card .k{ font-size:11px; color:var(--muted); }
  .stat-card .v{ font-size:26px; font-weight:800; margin:4px 0 8px; }
  .pill{
    display:inline-block; background:var(--purple2); font-size:11px; font-weight:700;
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .grid3{ display:flex; justify-content:space-between; margin:18px 0; text-align:center;}
  .grid3 .g{ flex:1; }
  .grid3 .ic{
    width:34px; height:34px; border-radius:10px; background:#1a1a2b; display:flex; align-items:center;
    justify-content:center; font-size:15px; margin:0 auto 6px;
  }
  .grid3 span{ font-size:9.5px; color:var(--muted); }

  .list{ background:#141420; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:8px;}
  .list-item{
    display:flex; justify-content:space-between; align-items:center; padding:15px 16px;
    border-bottom:1px solid var(--line); font-size:13.5px; font-weight:600; cursor:pointer;
    transition:.15s;
  }
  .list-item:hover{ background:#1a1a2b; }
  .list-item:last-child{ border-bottom:none; }
  .list-item .chev{ color:var(--muted); }
  .list-item .radio{ width:16px; height:16px; border-radius:50%; border:2px solid var(--muted); }
  .list-item.selected .radio{ border-color:var(--purple); background:radial-gradient(circle,var(--purple) 40%, transparent 45%); }
  .list-item.selected{ background:#1a1a2b; }

  .center{ text-align:center; margin:auto 0; }
  .icon-circle{
    width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;
  }
  .icon-circle.success{ background:var(--success); }

  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center; margin:auto 0;}
  .empty .em-icon{ font-size:44px; margin-bottom:14px; }
  .empty p{ font-size:13px; color:rgba(255,255,255,.7); margin-bottom:6px; }

  .note{
    background:rgba(255,255,255,.08); border-radius:10px; padding:12px; font-size:11px;
    line-height:1.5; color:rgba(255,255,255,.7); margin-top:14px;
  }

  .timeline{ display:flex; flex-direction:column; gap:20px; margin-top:14px; }
  .t-item{ display:flex; gap:12px; }
  .t-dot{
    width:22px; height:22px; border-radius:50%; background:var(--purple);
    display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
  }
  .t-item.pending .t-dot{ background:transparent; border:2px solid rgba(255,255,255,.4); }
  .t-txt b{ display:block; font-size:13px; }
  .t-txt span{ font-size:11px; color:rgba(255,255,255,.5); }
  .line-conn{ width:2px; background:rgba(255,255,255,.2); margin-left:10px; height:20px; }

  .bottom-nav{
    display:flex; justify-content:space-around; padding-top:14px; margin-top:8px;
  }
  .nav-item{ text-align:center; font-size:9.5px; color:var(--muted); font-weight:700; cursor:pointer; }
  .nav-item.active{ color:var(--purple); }
  .nav-item .ni-ic{ font-size:16px; display:block; margin-bottom:2px; }

  .field-group{ display:flex; flex-direction:column; gap:2px; }
  .amount-badge{ font-size:11px; color:rgba(255,255,255,.6); }
  .amount-badge b{ color:#fff; font-size:13px; }

  .list-item.filled{ color:#fff; }
  .list-item .val{ font-size:11px; color:var(--muted); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .check{ color:var(--success); font-weight:800; }

  .toggle{
    width:38px; height:22px; border-radius:20px; background:#2a2a3d; position:relative; cursor:pointer; flex-shrink:0;
  }
  .toggle.on{ background:var(--purple); }
  .toggle::after{
    content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:.15s;
  }
  .toggle.on::after{ left:18px; }

  .toast{
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1c1c2e; border:1px solid var(--line); color:#fff; padding:12px 20px;
    border-radius:12px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:.25s; z-index:999; max-width:320px; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .slider-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  input[type=range]{ width:100%; accent-color:var(--purple); }
</style>
</head>
<body>

<div class="phone-shell">
  <div class="topbar" id="topbar">
    <span class="logo">$</span> MONEY LOAN
  </div>
  <div class="screen" id="screen"></div>
  <div class="bottom-nav" id="bottomnav" style="display:none;">
    <div class="nav-item" data-nav="home"><span class="ni-ic">🏠</span>HOME</div>
    <div class="nav-item" data-nav="bill"><span class="ni-ic">📄</span>BILL</div>
    <div class="nav-item" data-nav="me"><span class="ni-ic">👤</span>ME</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Simple in-memory state & router ---------------- */
const state = {
  email:'', password:'', phone:'', otp:'',
  loanAmount:10000, tenure:24, paymentMethod:null,
  applicationId:'MLN-2024-05-00021',
  activeLoan:false, loanStage:'submitted', /* submitted -> review -> approval -> disbursed */
  contactInfo:{ purpose:'', education:'', address:'', credits:'', email:'', profession:'' },
  references:['', '', ''],
  idType:'', idPhotoTaken:false, idPhotoData:null,
  notifs:true, faceId:false,
  loanHistory:[],
  name:'',
  stageDates:{ submitted:null, review:null, approval:null, disbursed:null },
};

const FIELD_OPTIONS = {
  purpose: ['Personal', 'Business', 'Education', 'Medical Expenses', 'Home Improvement', 'Debt Consolidation'],
  education: ['High School', 'Vocational', 'College Undergraduate', 'College Graduate', 'Post Graduate'],
  credits: ['0', '1-2', '3-5', '6-10', '10+'],
  profession: ['Employed', 'Self-Employed', 'Business Owner', 'Freelancer', 'Student', 'Retired'],
};

const screenEl = document.getElementById('screen');
const topbarEl = document.getElementById('topbar');
const bottomnavEl = document.getElementById('bottomnav');
const toastEl = document.getElementById('toast');
let history_ = [];
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function formatDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', {month:'short', day:'2-digit', year:'numeric'});
}

function go(name, opts={}){
  if(opts.push !== false) history_.push(name);
  render(name, opts);
}
function back(){
  history_.pop();
  const prev = history_[history_.length-1] || 'welcome';
  render(prev, {});
}

function setTopbar(title, showBack){
  topbarEl.innerHTML = showBack
    ? `<span class="back" onclick="back()">‹</span> ${title}`
    : `<span class="logo">$</span> ${title}`;
}

function setNav(active){
  if(active){
    bottomnavEl.style.display='flex';
    [...bottomnavEl.children].forEach(c=>{
      c.classList.toggle('active', c.dataset.nav===active);
    });
  } else {
    bottomnavEl.style.display='none';
  }
}

bottomnavEl.addEventListener('click', e=>{
  const item = e.target.closest('.nav-item');
  if(!item) return;
  const nav = item.dataset.nav;
  if(nav==='home') go('home');
  if(nav==='bill') go(state.activeLoan ? 'track' : 'billEmpty');
  if(nav==='me') go('me');
});

/* ---------------- Screens ---------------- */
const screens = {

  welcome(){
    setTopbar('MONEY LOAN', false); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <div class="center">
        <div class="icon-circle" style="font-size:34px;">💰</div>
        <h1 class="title">WELCOME TO<br>MONEY LOAN</h1>
        <p class="sub">Quick and easy loans anytime, anywhere.</p>
      </div>
      <button class="btn white" onclick="go('login')">GET STARTED</button>
    `;
  },

  login(){
    setTopbar('MONEY LOAN', false); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <h1 class="title">Welcome Back!</h1>
      <p class="sub">Login to continue</p>
      <label>Email</label>
      <input id="email" type="email" placeholder="Enter your email" value="${state.email}">
      <label>Password</label>
      <input id="password" type="password" placeholder="Enter your password">
      <div style="text-align:right; margin-top:8px;"><span class="link" style="display:inline; margin:0; cursor:pointer;" onclick="go('forgotPassword')">Forgot password?</span></div>
      <button class="btn" onclick="doLogin()">LOGIN</button>
      <div class="link">Don't have an account? <b onclick="go('signup')">Sign up</b></div>
    `;
  },

  signup(){
    setTopbar('Create Account', true); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <h1 class="title">Create Account</h1>
      <p class="sub">Sign up to get started</p>
      <label>Full Name</label>
      <input id="suName" placeholder="Enter your full name">
      <label>Email</label>
      <input id="suEmail" type="email" placeholder="Enter your email">
      <label>Password</label>
      <input id="suPassword" type="password" placeholder="Create a password">
      <button class="btn" onclick="doSignup()">CREATE ACCOUNT</button>
      <div class="link">Already have an account? <b onclick="go('login')">Login</b></div>
    `;
  },

  forgotPassword(){
    setTopbar('Reset Password', true); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <h1 class="title">Reset Password</h1>
      <p class="sub">Enter your email and we'll send you a reset link</p>
      <label>Email</label>
      <input id="fpEmail" type="email" placeholder="Enter your email" value="${state.email}">
      <button class="btn" onclick="doForgotPassword()">SEND RESET LINK</button>
    `;
  },

  phone(){
    setTopbar('Verify Phone', true); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <h1 class="title">Enter Phone Number</h1>
      <p class="sub">We'll send you a verification code</p>
      <label>Mobile Number</label>
      <div style="display:flex; gap:8px;">
        <input style="width:64px; text-align:center;" value="+63" disabled>
        <input id="phone" type="tel" placeholder="912 345 6789" maxlength="10" value="${state.phone}">
      </div>
      <button class="btn" onclick="submitPhone()">ENTER</button>
      <div class="link">We will send an OTP to verify your number</div>
    `;
  },

  otp(){
    setTopbar('Verify OTP', true); setNav(null);
    screenEl.className='screen';
    screenEl.innerHTML=`
      <h1 class="title">Enter OTP</h1>
      <p class="sub">Enter the 6-digit code sent to +63 ${state.phone||'912 345 6789'}</p>
      <div class="otp-row">
        ${[0,1,2,3,4,5].map(i=>`<input maxlength="1" class="otp-d" data-i="${i}" inputmode="numeric">`).join('')}
      </div>
      <div class="hint">Demo code: 873995</div>
      <div class="timer" id="otpTimer">Resend OTP (00:45)</div>
      <button class="btn" onclick="verifyOtp()">VERIFY</button>
    `;
    const inputs = screenEl.querySelectorAll('.otp-d');
    inputs.forEach((inp,i)=>{
      inp.addEventListener('input', ()=>{
        inp.value = inp.value.replace(/[^0-9]/g,'');
        if(inp.value && inputs[i+1]) inputs[i+1].focus();
      });
      inp.addEventListener('keydown', e=>{
        if(e.key==='Backspace' && !inp.value && inputs[i-1]) inputs[i-1].focus();
      });
    });
    startOtpTimer();
  },

  home(){
    setTopbar('MONEY LOAN', false); setNav('home');
    screenEl.className='screen light';
    screenEl.innerHTML = state.activeLoan ? `
      <div class="stat-card">
        <div class="k">Active Loan</div>
        <div class="v">$ ${state.loanAmount.toLocaleString()}</div>
        <span class="pill" onclick="go('track')">Track Application</span>
      </div>
      <div class="grid3">
        <div class="g"><div class="ic">🔒</div><span>Secure</span></div>
        <div class="g"><div class="ic">📆</div><span>${state.tenure} Months</span></div>
        <div class="g"><div class="ic">👥</div><span>10M+ Users</span></div>
      </div>
      <div class="note">Your loan is currently being processed. You'll be notified once funds are disbursed.</div>
    ` : `
      <div class="stat-card">
        <div class="k">Highest available</div>
        <div class="v">$ 50,000</div>
        <div style="font-size:11px; color:var(--muted); margin-bottom:8px;">Interest rate 0.035%/day &nbsp;·&nbsp; Result in Instant</div>
        <span class="pill" onclick="toast('Your credit limit: $50,000 — instantly approved!')">Get Credit Limit</span>
      </div>
      <div class="grid3">
        <div class="g"><div class="ic">🔒</div><span>Subject to<br>Money Loan</span></div>
        <div class="g"><div class="ic">5</div><span>5 years</span></div>
        <div class="g"><div class="ic">👥</div><span>10 Million+</span></div>
        <div class="g"><div class="ic">⬇</div><span>Total<br>downloads</span></div>
      </div>
      <div class="empty" style="margin-top:8px;">
        <div class="em-icon">📄🔍</div>
        <p>You don't have an active loan yet.</p>
      </div>
      <button class="btn" onclick="go('contactId')">APPLY FOR A LOAN</button>
      <div class="note">This is a sample interest rate. Actual terms may vary depending on your credit profile and are subject to approval.</div>
    `;
  },

  billEmpty(){
    setTopbar('MONEY LOAN', false); setNav('bill');
    screenEl.className='screen';
    screenEl.innerHTML=`
      <div class="empty">
        <div class="em-icon">📋💰</div>
        <p>You don't have an active loan yet.</p>
      </div>
      <button class="btn" onclick="go('contactId')">APPLY FOR A LOAN</button>
    `;
  },

  me(){
    setTopbar('MONEY LOAN', false); setNav('me');
    screenEl.className='screen light';
    screenEl.innerHTML=`
      <div class="center" style="margin:10px 0 20px;">
        <div class="icon-circle">👤</div>
        <h1 class="title" style="font-size:16px;">${state.name || state.email || 'Guest User'}</h1>
        <p class="sub" style="margin-bottom:0;">${state.phone ? '+63 '+state.phone : 'Not logged in'}</p>
      </div>
      <div class="list">
        <div class="list-item" onclick="go('profile')">My Profile <span class="chev">›</span></div>
        <div class="list-item" onclick="go('paymentMethod', {from:'me'})">Payment Methods <span class="chev">›</span></div>
        <div class="list-item" onclick="go('loanHistory')">Loan History <span class="chev">›</span></div>
        <div class="list-item" onclick="go('settings')">Settings <span class="chev">›</span></div>
      </div>
      <button class="btn outline" style="margin-top:20px;" onclick="logout()">LOG OUT</button>
    `;
  },

  profile(){
    setTopbar('My Profile', true); setNav(null);
    screenEl.className='screen light';
    screenEl.innerHTML=`
      <label>Full Name</label>
      <input id="pfName" value="${state.name}" placeholder="Your full name">
      <label>Email</label>
      <input id="pfEmail" value="${state.email}" placeholder="Your email">
      <label>Phone</label>
      <input id="pfPhone" value="${state.phone}" placeholder="Your phone">
      <button class="btn" onclick="saveProfile()">SAVE CHANGES</button>
    `;
  },

  loanHistory(){
    setTopbar('Loan History', true); setNav(null);
    screenEl.className='screen light';
    if(state.loanHistory.length===0){
      screenEl.innerHTML=`
        <div class="empty">
          <div class="em-icon">📂</div>
          <p>No past loans yet.</p>
        </div>
      `;
    } else {
      screenEl.innerHTML=`
        <div class="list">
          ${state.loanHistory.map(l=>`
            <div class="list-item">
              <span>$ ${l.amount.toLocaleString()} · ${l.tenure}mo</span>
              <span class="val">${l.status}</span>
            </div>
          `).join('')}
        </div>
      `;
    }
  },

  settings(){
    setTopbar('Settings', true); setNav(null);
    screenEl.className='screen light';
    screenEl.innerHTML=`
      <div class="list">
        <div class="list-item" style="cursor:default;">
          <span>Push Notifications</span>
          <span class="toggle ${state.notifs?'on':''}" id="tgNotifs"></span>
        </div>
        <div class="list-item" style="cursor:default;">
          <span>Face ID Login</span>
          <span class="toggle ${state.faceId?'on':''}" id="tgFaceId"></span>
        </div>
      </div>
      <div class="link" style="margin-top:16px;">App Version 1.0.0</div>
    `;
    document.getElementById('tgNotifs').onclick = ()=>{ state.notifs=!state.notifs; go('settings',{push:false}); toast('Notifications '+(state.notifs?'enabled':'disabled')); };
    document.getElementById('tgFaceId').onclick = ()=>{ state.faceId=!state.faceId; go('settings',{push:false}); toast('Face ID '+(state.faceId?'enabled':'disabled')); };
  },

  contactId(){
    setTopbar('Basic Contact ID', true); setNav(null);
    screenEl.className='screen light';
    const ci = state.contactInfo;
    const fields = [
      ['purpose','Purpose of loan'],['education','Education Level'],
      ['address','Residential Address'],['credits','Number of Credits'],
      ['email','Email']
    ];
    screenEl.innerHTML=`
      <p style="font-size:12px; font-weight:700; margin-bottom:6px;">Personal Information</p>
      <div class="list" id="ciList">
        ${fields.map(([k,label])=>`
          <div class="list-item ${ci[k]?'filled':''}" data-k="${k}" data-label="${label}">
            <span>${label}</span>
            <span class="val">${ci[k] ? '<span class=\"check\">✓</span> '+ci[k] : ''} <span class="chev">›</span></span>
          </div>`).join('')}
      </div>
      <p style="font-size:12px; font-weight:700; margin:14px 0 6px;">Work Information</p>
      <div class="list">
        <div class="list-item ${ci.profession?'filled':''}" data-k="profession" data-label="Profession">
          <span>Profession</span>
          <span class="val">${ci.profession ? '<span class=\"check\">✓</span> '+ci.profession : ''} <span class="chev">›</span></span>
        </div>
      </div>
      <button class="btn" onclick="submitContactId()">NEXT</button>
      <div class="link">Used for verification only</div>
    `;
    screenEl.querySelectorAll('.list-item[data-k]').forEach(item=>{
      item.onclick = ()=>{
        const k = item.dataset.k, label = item.dataset.label;
        if(FIELD_OPTIONS[k]) go('fieldPicker', {key:k, label, options:FIELD_OPTIONS[k], target:'contactInfo'});
        else go('fieldInput', {key:k, label, target:'contactInfo'});
      };
    });
  },

  fieldPicker(opts){
    setTopbar(opts.label, true); setNav(null);
    screenEl.className='screen light';
    const current = state[opts.target][opts.key];
    screenEl.innerHTML=`
      <p style="font-size:13px; font-weight:700; margin-bottom:10px;">Select ${opts.label}</p>
      <div class="list" id="pickList">
        ${opts.options.map(o=>`<div class="list-item ${current===o?'selected':''}" data-v="${o}">${o} <span class="chev">${current===o?'<span class=\"check\">✓</span>':'›'}</span></div>`).join('')}
      </div>
    `;
    document.getElementById('pickList').addEventListener('click', e=>{
      const item = e.target.closest('.list-item'); if(!item) return;
      state[opts.target][opts.key] = item.dataset.v;
      toast(opts.label+' set to '+item.dataset.v);
      back();
    });
  },

  fieldInput(opts){
    setTopbar(opts.label, true); setNav(null);
    screenEl.className='screen light';
    const current = state[opts.target][opts.key] || '';
    screenEl.innerHTML=`
      <label>${opts.label}</label>
      <input id="fiVal" placeholder="Enter ${opts.label.toLowerCase()}" value="${current}">
      <button class="btn" onclick="saveFieldInput()">SAVE</button>
    `;
    window._fiOpts = opts;
    setTimeout(()=>document.getElementById('fiVal')?.focus(), 50);
  },

  references(){
    setTopbar('Contact References', true); setNav(null);
    screenEl.className='screen light';
    screenEl.innerHTML=`
      <p style="font-size:13px; font-weight:700;">Contact Information</p>
      <label>Contact Reference 1</label>
      <input id="ref0" placeholder="Full Name / Phone Number" value="${state.references[0]}">
      <label>Contact Reference 2</label>
      <input id="ref1" placeholder="Full Name / Phone Number" value="${state.references[1]}">
      <label>Contact Reference 3</label>
      <input id="ref2" placeholder="Full Name / Phone Number" value="${state.references[2]}">
      <button class="btn" onclick="submitReferences()">NEXT</button>
    `;
  },

  idSelect(){
    setTopbar('Select ID Type', true); setNav(null);
    screenEl.className='screen light';
    const types = ["License","National ID","Voter's ID","Student ID","Passport ID"];
    screenEl.innerHTML=`
      <p style="font-size:13px; font-weight:700; margin-bottom:10px;">Select ID Type</p>
      <div class="list" id="idList">
        ${types.map(t=>`<div class="list-item ${state.idType===t?'selected':''}" data-t="${t}">${t} <span class="chev">${state.idType===t?'<span class=\"check\">✓</span>':'›'}</span></div>`).join('')}
      </div>
    `;
    document.getElementById('idList').addEventListener('click', e=>{
      const item = e.target.closest('.list-item'); if(!item) return;
      state.idType = item.dataset.t;
      state.idPhotoTaken = false;
      state.idPhotoData = null;
      go('idPhoto');
    });
  },

  idPhoto(){
    setTopbar(`Photo of your ${state.idType||'ID'}`, true); setNav(null);
    screenEl.className='screen plain';
    screenEl.innerHTML=`
      <input type="file" id="idFileInput" accept="image/*" style="display:none;">
      <div id="idCapture" style="border:2px dashed #ccc; border-radius:14px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">
        ${state.idPhotoData ? `
          <img src="${state.idPhotoData}" style="width:100%; height:100%; object-fit:cover; border-radius:12px;">
        ` : `
          <div style="font-size:34px;">📷</div>
          <p style="font-size:12px; text-align:center; color:#777; margin-top:10px; padding:0 20px;">Tap to select a photo from your gallery</p>
        `}
      </div>
      ${state.idPhotoData ? `
        <button class="btn" style="background:transparent; border:1.5px solid #ccc; color:#333; box-shadow:none;" onclick="document.getElementById('idFileInput').click()">CHOOSE A DIFFERENT PHOTO</button>
        <button class="btn" onclick="go('paymentMethod')">CONTINUE</button>
      ` : ''}
    `;
    const fileInput = document.getElementById('idFileInput');
    document.getElementById('idCapture').onclick = ()=> fileInput.click();
    fileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        state.idPhotoData = reader.result;
        state.idPhotoTaken = true;
        toast('Photo selected from gallery');
        go('idPhoto', {push:false});
      };
      reader.readAsDataURL(file);
    };
  },

  paymentMethod(opts){
    setTopbar('Payment Method', true); setNav(null);
    screenEl.className='screen light';
    const methods = [['🏦','Bank Transfer'],['💳','GCash'],['🪙','Maya'],['💰','Credit / Debit Card']];
    const fromMe = history_[history_.length-2] === 'me' || (opts&&opts.from==='me');
    screenEl.innerHTML=`
      <h1 class="title" style="font-size:16px;">Payment Method</h1>
      <p class="sub">Choose your preferred payment method</p>
      <div class="list" id="payList">
        ${methods.map((m,i)=>`<div class="list-item ${state.paymentMethod===m[1]?'selected':''}" data-i="${i}"><span>${m[0]} &nbsp;${m[1]}</span><span class="radio"></span></div>`).join('')}
      </div>
      <button class="btn" onclick="submitPaymentMethod()">${fromMe?'SAVE':'NEXT'}</button>
    `;
    document.getElementById('payList').addEventListener('click', e=>{
      const item = e.target.closest('.list-item'); if(!item) return;
      [...item.parentElement.children].forEach(c=>c.classList.remove('selected'));
      item.classList.add('selected');
      state.paymentMethod = methods[item.dataset.i][1];
    });
  },

  submit(){
    setTopbar('MONEY LOAN', false); setNav(null);
    state.activeLoan = true;
    state.loanStage = 'submitted';
    state.stageDates.submitted = new Date();
    screenEl.className='screen';
    screenEl.innerHTML=`
      <div class="center">
        <div class="icon-circle success">✓</div>
        <h1 class="title" style="font-size:18px;">Application Submitted!</h1>
        <p class="sub">We've received your application. You'll get a response shortly.</p>
        <div class="note" style="text-align:center;">Application ID<br><b style="color:#fff; font-size:13px;">${state.applicationId}</b></div>
      </div>
      <button class="btn outline" onclick="go('track')">VIEW STATUS</button>
      <button class="btn" onclick="goHome()">BACK TO HOME</button>
    `;
  },

  approved(){
    setTopbar('MONEY LOAN', false); setNav(null);
    state.loanStage = 'disbursed';
    screenEl.className='screen';
    screenEl.innerHTML=`
      <div class="center">
        <div class="icon-circle" style="font-size:26px;">💵</div>
        <h1 class="title" style="font-size:18px;">Congratulations!</h1>
        <p class="sub">Your loan has been approved.</p>
        <div class="note" style="text-align:left;">
          Approved Amount<br><b style="color:#fff; font-size:16px;">$ ${state.loanAmount.toLocaleString()}</b><br><br>
          Loan Tenure<br><b style="color:#fff;">${state.tenure} Months</b><br><br>
          Disbursement Method<br><b style="color:#fff;">${state.paymentMethod||'Bank Transfer'} (••••1234)</b>
        </div>
      </div>
      <button class="btn" onclick="go('track', {push:false})">VIEW LOAN DETAILS</button>
      <button class="btn outline" onclick="goHome()">BACK TO HOME</button>
    `;
  },

  track(){
    setTopbar('Track Application', true); setNav('bill');
    screenEl.className='screen';
    const stage = state.loanStage;
    const steps = [
      {key:'submitted', label:'Application Submitted'},
      {key:'review', label:'Under Review'},
      {key:'approval', label:'Approval in Progress'},
      {key:'disbursed', label:'Loan Disbursement'},
    ];
    const order = ['submitted','review','approval','disbursed'];
    const currentIdx = order.indexOf(stage);
    screenEl.innerHTML=`
      <h1 class="title" style="font-size:16px;">Track Application</h1>
      <div class="note" style="margin-bottom:0;">Application ID<br><b style="color:#fff;">${state.applicationId}</b></div>
      <div class="timeline">
        ${steps.map((s,i)=>`
          <div class="t-item ${i>currentIdx?'pending':''}">
            <div class="t-dot">${i<=currentIdx?'✓':'◌'}</div>
            <div class="t-txt"><b>${s.label}</b><span>${i<=currentIdx ? formatDate(state.stageDates[s.key]) : 'Pending'}</span></div>
          </div>
        `).join('')}
      </div>
      ${currentIdx < order.length-1 ? `<button class="btn ghost" onclick="advanceStage()">Simulate: Next Stage →</button>` : `<div class="link">Loan fully disbursed 🎉</div>`}
    `;
  },
};

function render(name, opts){
  screens[name](opts);
}

/* ---------------- Actions ---------------- */
function doLogin(){
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value.trim();
  if(!email || !pw){ toast('Please enter email and password'); return; }
  state.email = email;
  go('phone');
}
function doSignup(){
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pw = document.getElementById('suPassword').value.trim();
  if(!name || !email || !pw){ toast('Please fill in all fields'); return; }
  state.name = name; state.email = email;
  toast('Account created!');
  go('phone');
}
function doForgotPassword(){
  const email = document.getElementById('fpEmail').value.trim();
  if(!email){ toast('Please enter your email'); return; }
  toast('Reset link sent to '+email);
  go('login', {push:false});
}
function submitPhone(){
  const v = document.getElementById('phone').value.trim();
  if(!v){ toast('Please enter your phone number'); return; }
  state.phone = v;
  go('otp');
}
function startOtpTimer(){
  let t=45;
  const timerEl = document.getElementById('otpTimer');
  timerEl.style.cursor='default'; timerEl.style.color='';
  timerEl.onclick = null;
  clearInterval(window._otpIv);
  window._otpIv = setInterval(()=>{
    t--;
    if(t<=0){
      clearInterval(window._otpIv);
      timerEl.textContent='Resend OTP';
      timerEl.style.color='var(--purple)'; timerEl.style.cursor='pointer';
      timerEl.onclick = ()=>{ toast('OTP resent'); startOtpTimer(); };
      return;
    }
    timerEl.textContent = `Resend OTP (00:${String(t).padStart(2,'0')})`;
  },1000);
}
function verifyOtp(){
  const digits = [...screenEl.querySelectorAll('.otp-d')].map(i=>i.value).join('');
  if(digits.length < 6){ toast('Please enter the 6-digit code'); return; }
  if(digits !== '873995'){ toast('Incorrect code — try demo code 873995'); return; }
  toast('Phone verified');
  history_=['home']; render('home');
}
function saveFieldInput(){
  const opts = window._fiOpts;
  const val = document.getElementById('fiVal').value.trim();
  if(!val){ toast('Please enter a value'); return; }
  state[opts.target][opts.key] = val;
  toast(opts.label+' saved');
  back();
}
function submitContactId(){
  const ci = state.contactInfo;
  const required = ['purpose','education','address','credits','email','profession'];
  const missing = required.some(k=>!ci[k]);
  if(missing){ toast('Please complete all fields'); return; }
  go('references');
}
function submitReferences(){
  const vals = [0,1,2].map(i=>document.getElementById('ref'+i).value.trim());
  if(vals.some(v=>!v)){ toast('Please fill in all 3 references'); return; }
  state.references = vals;
  go('idSelect');
}
function submitPaymentMethod(){
  if(!state.paymentMethod){ toast('Please select a payment method'); return; }
  const fromMe = history_[history_.length-2] === 'me';
  if(fromMe){ toast('Payment method saved'); back(); return; }
  go('submit');
}
function saveProfile(){
  state.name = document.getElementById('pfName').value.trim();
  state.email = document.getElementById('pfEmail').value.trim();
  state.phone = document.getElementById('pfPhone').value.trim();
  toast('Profile updated');
  back();
}
function advanceStage(){
  const order = ['submitted','review','approval','disbursed'];
  const idx = order.indexOf(state.loanStage);
  if(idx < order.length-1){
    state.loanStage = order[idx+1];
    state.stageDates[state.loanStage] = new Date();
    if(state.loanStage==='disbursed'){
      state.loanHistory.unshift({amount:state.loanAmount, tenure:state.tenure, status:'Disbursed'});
      toast('Loan disbursed! 🎉');
    } else {
      toast('Status updated: '+state.loanStage);
    }
    go('track', {push:false});
  }
}
function goHome(){
  history_=['home']; render('home');
}
function logout(){
  Object.assign(state, {
    email:'', password:'', phone:'', activeLoan:false, name:'',
    contactInfo:{purpose:'',education:'',address:'',credits:'',email:'',profession:''},
    references:['','',''], idType:'', idPhotoTaken:false, idPhotoData:null, paymentMethod:null,
  });
  history_=['welcome']; render('welcome');
  toast('Logged out');
}

/* boot */
go('welcome');
</script>

</body>
</html>
